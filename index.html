<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A local planning and documentation tool for Crestron Zūm lighting control systems." />
    <title>Zūm System Planner</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23004f71'/%3E%3Cpath d='M15 19h34L25 45h24' fill='none' stroke='%23fff' stroke-width='7' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="styles.css?v=20261118-demo" />
    <link rel="stylesheet" href="takeoff-wiring.css?v=20261120-wiring2" />
    <link rel="stylesheet" href="one-line.css?v=20261120-wiring" />
  </head>
  <body>
    <div class="app-shell" id="app-shell">
      <aside class="sidebar" aria-label="Crestron Zūm system design workflow">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true"><span>Z</span></div>
          <div>
            <p class="eyebrow">Crestron lighting</p>
            <h1>Zūm System Planner</h1>
          </div>
        </div>

        <div class="project-identity" id="project-identity"></div>

        <nav class="workflow-nav" id="workflow-nav"></nav>

        <div class="sidebar-footer">
          <button class="quiet-button" id="demo-button" type="button"></button>
          <button class="quiet-button" id="design-reference-button" type="button"></button>
          <button class="quiet-button" id="project-settings-button" type="button"></button>
          <button class="quiet-button" id="data-tools-button" type="button"></button>
          <p>Reference-driven design prototype</p>
        </div>
      </aside>

      <main class="main-content">
        <header class="topbar">
          <button class="icon-button mobile-menu" id="mobile-menu-button" type="button" aria-label="Open navigation"></button>
          <div class="breadcrumb" id="breadcrumb"></div>
          <div class="topbar-actions">
            <div class="save-state"><span class="save-dot"></span><span id="save-state-text">Saved locally</span></div>
            <button class="secondary-button" id="preview-report-button" type="button"></button>
            <button class="primary-button" id="add-record-button" type="button"></button>
          </div>
        </header>

        <section class="workspace" id="workspace" aria-live="polite"></section>
      </main>
    </div>

    <div class="modal-backdrop hidden" id="modal-backdrop">
      <section class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"></section>
    </div>

    <div class="toast-region" id="toast-region" aria-live="polite"></div>

    <template id="empty-state-template">
      <div class="empty-state">
        <div class="empty-icon"></div>
        <h3></h3>
        <p></p>
        <button class="primary-button" type="button"></button>
      </div>
    </template>

    <script src="catalog.js?v=20261118-demo"></script>
    <script src="configurator.js?v=20261118-demo"></script>
    <script src="space-ui.js?v=20261118-demo"></script>
    <script src="record-relations.js?v=20261118-demo"></script>
    <script src="programming.js?v=20261118-demo"></script>
    <script src="programming-files.js?v=program-files2"></script>
    <script src="wired-demo.js?v=20261118-demo"></script>
    <script src="one-line.js?v=20261120-wiring2"></script>
    <script src="app.js?v=20261120-wiring"></script>
    <script src="takeoff-toolbox.js?v=20261120-wiring"></script>
    <script src="takeoff-wiring.js?v=20261120-wiring"></script>
    <script src="takeoff.js?v=20261120-wiring2"></script>
  </body>
</html>
